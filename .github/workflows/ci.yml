name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and lint
        run: npm run check

      - name: Security unit tests
        run: npm run security:unit

      - name: Start fallback server
        run: |
          npm run dev:webpack -- --hostname 127.0.0.1 --port 3001 > /tmp/geo-next.log 2>&1 &
          echo $! > /tmp/geo-next.pid
          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:3001/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/geo-next.log
          exit 1

      - name: Fallback blackbox
        env:
          GEO_BASE_URL: http://127.0.0.1:3001
        run: npm run blackbox:fallback

      - name: Stop fallback server
        if: always()
        run: |
          if [ -f /tmp/geo-next.pid ]; then
            kill "$(cat /tmp/geo-next.pid)" || true
          fi

      - name: Clean development output
        run: rm -rf .next

      - name: Production build
        run: npm run build
